name: Build ACTIVE24 image

on:
  workflow_dispatch:
  push:
    tags:
      - 'active24-v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'norman67cz/ultimate-ca-manager'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Test provider and ACME integration
        run: |
          python -m pip install -r backend/requirements.txt pytest
          cd backend
          python -m pytest -q \
            tests/test_dns_provider_active24.py \
            tests/test_acme_renewal_dns_cleanup.py \
            tests/test_acme_proxy_ca_account.py \
            tests/test_acme_local_domain_suffix.py \
            tests/test_eab_allowed_domains.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: metadata
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/active24-v* ]]; then
            echo "image_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/norman67cz/ultimate-ca-manager-active24:${{ steps.metadata.outputs.image_tag }}
            ghcr.io/norman67cz/ultimate-ca-manager-active24:sha-${{ steps.metadata.outputs.short_sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.metadata.outputs.image_tag }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
            OCI_SOURCE=https://github.com/norman67cz/ultimate-ca-manager
          cache-from: type=gha
          cache-to: type=gha,mode=max
