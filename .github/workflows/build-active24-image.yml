name: build-active24-image
on:
  workflow_dispatch:
  push:
    tags: ['active24-v*']
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.repository_owner == 'norman67cz'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r backend/requirements.txt pytest && cd backend && pytest tests/test_dns_provider_active24.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/ultimate-ca-manager-active24:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/ultimate-ca-manager-active24:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }},VERSION=${{ github.ref_name }}
