services:
  ucm:
    image: ghcr.io/norman67cz/ultimate-ca-manager-active24:${UCM_IMAGE_TAG}
    container_name: ucm
    restart: unless-stopped
    ports:
      - "${UCM_BIND_IP:-0.0.0.0}:${UCM_HTTPS_PORT:-8443}:8443"
      - "${UCM_BIND_IP:-0.0.0.0}:${UCM_HTTP_PORT:-8080}:8080"
    environment:
      UCM_FQDN: ${UCM_FQDN}
      UCM_HTTPS_PORT: ${UCM_HTTPS_PORT}
      UCM_HTTP_PORT: ${UCM_HTTP_PORT}
      UCM_DEBUG: "false"
      UCM_LOG_LEVEL: INFO
      UCM_SECRET_KEY: ${UCM_SECRET_KEY}
      UCM_JWT_SECRET: ${UCM_JWT_SECRET}
      UCM_BACKUP_ENABLED: "true"
      UCM_BACKUP_RETENTION_DAYS: ${UCM_BACKUP_RETENTION_DAYS}
    volumes:
      - ucm-data:/opt/ucm/data
      - ucm-hsm-tokens:/var/lib/softhsm/tokens
      - ucm-config:/etc/ucm
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    healthcheck:
      test: [CMD, curl, -f, -k, https://localhost:8443/api/health]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
volumes:
  ucm-data:
  ucm-hsm-tokens:
  ucm-config:
